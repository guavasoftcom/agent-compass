server:
  port: 8080
spring:
  # Jackson 3 (Spring Boot 4) writes dates as ISO-8601 strings by default
  # (WRITE_DATES_AS_TIMESTAMPS moved to DateTimeFeature and now defaults to false),
  # so the explicit serialization override that used to live here is no longer needed.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coding_agent_tuning}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      poll-interval: 1000ms
      quiet-period: 400ms
tuning:
  bash-antipattern-prefixes:
    - cat
    - head
    - tail
    - find
    - sed
    - awk
    - echo
logging:
  level:
    org.apache.tomcat.util.net: DEBUG
