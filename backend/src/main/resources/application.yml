server:
  port: 8080
spring:
  # Jackson 3 (Spring Boot 4) writes dates as ISO-8601 strings by default
  # (WRITE_DATES_AS_TIMESTAMPS moved to DateTimeFeature and now defaults to false),
  # so the explicit serialization override that used to live here is no longer needed.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coding_agent_tuning}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      # Sized for the dashboard's read-heavy aggregation load without overwhelming
      # Postgres' own connection ceiling; well above the 2-connection default that
      # was previously implicit.
      maximum-pool-size: 20
      # Applied per-connection via SET on checkout (Postgres has no server-wide
      # default). Bounds any single native aggregation query — including a
      # forgotten LIMIT-less scan on the 1M+-row metric_points/log_records tables
      # — to 15s instead of one runaway statement pinning a pool connection
      # indefinitely.
      connection-init-sql: SET statement_timeout = 15000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      poll-interval: 1000ms
      quiet-period: 400ms
tuning:
  # First tokens of Bash commands with a dedicated-tool replacement, mapped to the
  # replacement the tuning report names in its anti-pattern suggestions.
  bash-antipattern-replacements:
    cat: Read
    head: Read (with limit)
    tail: Read (with offset)
    find: Glob
    sed: Read + Edit
    awk: Grep
    echo: Write
  # Tools whose latency/result size the agent cannot tune (subagents, web fetches);
  # excluded from the report's oversized and slow-and-large offender lists.
  externally-determined-tools:
    - Agent
    - Task
    - WebSearch
    - WebFetch
logging:
  level:
    org.apache.tomcat.util.net: DEBUG
